name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  check:
    name: Build, unit tests, screenshots, lint
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # Accepts the SDK licenses so AGP can provision compileSdk 37 on demand.
      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v6

      - name: Full gate
        run: >
          ./gradlew --console=plain --continue
          :app:assembleDebug
          :app:testDebugUnitTest
          :app:validateDebugScreenshotTest
          :feature:studio:testDebugUnitTest
          :feature:studio:validateDebugScreenshotTest
          :core:ingestion:testDebugUnitTest
          :core:color-engine:testDebugUnitTest
          :core:vision-curator:testDebugUnitTest
          :core:collage-composer:testDebugUnitTest
          :core:export-pipeline:testDebugUnitTest
          :app:lintDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
            **/build/outputs/screenshotTest-results/
          retention-days: 14

  release:
    name: Release build (R8)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v6

      - name: Assemble release
        run: ./gradlew --console=plain :app:assembleRelease :app:bundleRelease

      - name: Upload R8 mapping
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: r8-mapping
          path: app/build/outputs/mapping/release/
          if-no-files-found: ignore
          retention-days: 14
